name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev ffmpeg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (headless, no mpv/Slint runtime needed for clipforge-core)
        run: cargo test -p clipforge-core

      - name: Build workspace
        run: cargo build --workspace

      - name: Web unit tests and production build
        run: |
          rustup target add wasm32-unknown-unknown
          npm --prefix web ci
          make web-bindings
          npm --prefix web test
          npm --prefix web run build

      - name: Install Playwright Chromium
        run: npx --prefix web playwright install --with-deps chromium

      - name: Browser integration tests
        run: npm --prefix web run test:e2e
