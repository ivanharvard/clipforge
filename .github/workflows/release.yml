name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Cargo.toml's [workspace.package] version is the single source of truth;
# verify-version fails the whole run if the pushed tag doesn't match it, so a
# release can never accidentally ship under the wrong version. Every package
# recipe (PKGBUILD's pkgver, clipforge.wxs's Version) gets the tag's version
# stamped in at build time rather than needing to be bumped by hand.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        id: extract
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::Tag $tag (version $version) does not match Cargo.toml's workspace version $cargo_version. Bump Cargo.toml's [workspace.package] version to match before tagging."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux-appimage:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev ffmpeg libfuse2 python3-pip

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install appimage-builder
        run: pip install --user appimage-builder

      - name: Build AppImage
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ./scripts/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage

  linux-pacman:
    needs: verify-version
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed rustup ffmpeg mpv git

      - uses: actions/checkout@v4

      - name: Sync PKGBUILD version with tag
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ needs.verify-version.outputs.version }}/" \
            packaging/linux/pacman/PKGBUILD

      # makepkg refuses to run as root, and Arch's container images run
      # everything as root by default, so the checkout above needs handing
      # off to an unprivileged user before the actual build step.
      - name: Build pacman package as an unprivileged user
        run: |
          useradd -m builder
          chown -R builder:builder .
          runuser -u builder -- bash -c '
            set -euo pipefail
            rustup default stable
            ./scripts/build-pacman.sh
          '

      - uses: actions/upload-artifact@v4
        with:
          name: linux-pacman
          path: dist/*.pkg.tar.zst

  windows-msi:
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Sync WiX version with tag
        shell: pwsh
        run: |
          # PowerShell's -replace is case-INSENSITIVE by default, so this
          # was also matching line 1's XML declaration (`<?xml version="1.0"
          # ...?>` — lowercase "version" is required there by the XML spec)
          # and corrupting it to `Version="1.0.0.0"`, which WiX's parser
          # rejects (WIX0104, "line 1 position 7" — exactly where "version"
          # starts) while PowerShell itself reports no error, since
          # Set-Content doesn't validate XML. -creplace is case-sensitive,
          # so it only touches the WiX <Package Version="..."> attribute,
          # which really is capitalized.
          $path = "packaging/windows/clipforge.wxs"
          $content = Get-Content -Raw -Encoding utf8NoBOM -Path $path
          $content = $content -creplace 'Version="[0-9.]+"', 'Version="${{ needs.verify-version.outputs.version }}.0"'
          Set-Content -NoNewline -Encoding utf8NoBOM -Path $path -Value $content

      # Mirrors windows.yml's build-msi job so both stay buildable the same
      # way; duplicated rather than shared so a release run never breaks
      # because of an unrelated change to the PR-validation workflow.
      #
      # libmpv has never been a vcpkg port (microsoft/vcpkg#9511 was a
      # request, never fulfilled) — scripts/build-msi.ps1 fetches a prebuilt
      # libmpv-dev archive itself and converts its MinGW import library to an
      # MSVC-compatible mpv.lib via dumpbin/lib.exe, which need to be on PATH.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build MSI
        shell: pwsh
        run: .\scripts\build-msi.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist/ClipForge.msi

  publish-release:
    needs: [verify-version, linux-appimage, linux-pacman, windows-msi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ClipForge ${{ needs.verify-version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/linux-appimage/*.AppImage
            artifacts/linux-pacman/*.pkg.tar.zst
            artifacts/windows-msi/ClipForge.msi

  aur-publish:
    # Same gate as publish-release: only push to AUR once every platform
    # actually built, so the AUR package never points at a version that
    # doesn't have a real release behind it.
    needs: [verify-version, linux-appimage, linux-pacman, windows-msi]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git openssh curl

      - uses: actions/checkout@v4
        with:
          path: clipforge

      - name: Set up SSH for aur.archlinux.org
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur_ci
          chmod 600 ~/.ssh/aur_ci
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_ci
            User aur
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      # AUR lazily creates an empty repo the first time any valid package
      # name is cloned — there's no separate "create the package" step, but
      # the fallback below stays as a defensive no-op if that ever changes.
      - name: Clone the AUR package repo
        run: |
          git clone ssh://aur@aur.archlinux.org/clipforge.git aur-repo || {
            mkdir aur-repo
            git -C aur-repo init -b master
            git -C aur-repo remote add origin ssh://aur@aur.archlinux.org/clipforge.git
          }

      - name: Update PKGBUILD and regenerate .SRCINFO
        run: |
          set -euo pipefail
          version="${{ needs.verify-version.outputs.version }}"
          cp clipforge/packaging/linux/aur/PKGBUILD aur-repo/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=$version/" aur-repo/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" aur-repo/PKGBUILD
          sha=$(curl -sL "https://github.com/ivanharvard/clipforge/archive/refs/tags/v$version.tar.gz" | sha256sum | cut -d' ' -f1)
          sed -i "s/^sha256sums=.*/sha256sums=('$sha')/" aur-repo/PKGBUILD
          # makepkg refuses to run as root even for --printsrcinfo (which
          # only evaluates the PKGBUILD's variables, no network/build
          # needed), so this still needs handing off to an unprivileged user.
          useradd -m builder
          chown -R builder:builder aur-repo
          runuser -u builder -- bash -c 'cd aur-repo && makepkg --printsrcinfo > .SRCINFO'

      - name: Commit and push to AUR
        run: |
          cd aur-repo
          git config user.name "ClipForge CI"
          git config user.email "actions@github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "PKGBUILD/.SRCINFO unchanged — nothing to publish."
            exit 0
          fi
          git commit -m "Update to ${{ needs.verify-version.outputs.version }}"
          git push origin HEAD:master
