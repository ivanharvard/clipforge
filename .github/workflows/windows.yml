name: Windows package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/clipforge-app/**"
      - "crates/clipforge-player/**"
      - "packaging/windows/**"
      - "scripts/build-msi.ps1"
      - ".github/workflows/windows.yml"

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # libmpv has never been a vcpkg port (microsoft/vcpkg#9511 was a request,
      # never fulfilled) — scripts/build-msi.ps1 now fetches a prebuilt
      # libmpv-dev archive itself and converts its MinGW import library to an
      # MSVC-compatible mpv.lib via dumpbin/lib.exe, which need to be on PATH.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build MSI and validate Windows layout resources
        shell: pwsh
        run: .\scripts\build-msi.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Windows-MSI
          path: dist/ClipForge.msi
