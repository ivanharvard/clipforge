[workspace]
resolver = "2"
members = [
    "crates/clipforge-core",
    "crates/clipforge-player",
    "crates/clipforge-app",
    "crates/clipforge-web-bindings",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
clipforge-core = { path = "crates/clipforge-core" }
clipforge-player = { path = "crates/clipforge-player" }
slint = "1.17"
slint-build = "1.17"
libmpv2 = "6"
libmpv2-sys = "4"
rfd = "0.15"
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
