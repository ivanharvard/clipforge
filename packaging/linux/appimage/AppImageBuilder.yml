# scripts/build-appimage.sh stages the binary, desktop file, and icons into
# ./AppDir before invoking appimage-builder with this recipe. The AppImage
# relies on system ffmpeg/mpv (same as the pacman package's `depends`) rather
# than bundling them, since there's no portable static build for either on
# Linux the way scripts/fetch-ffmpeg.ps1 provides on Windows.
version: 1

AppDir:
  app_info:
    id: com.clipforge.ClipForge
    name: ClipForge
    icon: clipforge
    version: latest
    exec: usr/bin/clipforge-app
    exec_args: $@

  files:
    include: []
    exclude:
      - usr/share/man
      - usr/share/doc

AppImage:
  arch: x86_64
  update-information: guess
